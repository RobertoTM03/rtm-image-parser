services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rtm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtm}
      POSTGRES_DB: ${POSTGRES_DB:-rtm_image_parser}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rtm} -d ${POSTGRES_DB:-rtm_image_parser}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides .env's DATABASE_URL (which points at localhost for host-side
      # tooling like `npm run dev`/`npm run migrate` outside Docker) so the
      # containerized api reaches Postgres via the compose network instead.
      # Credentials still come from the same POSTGRES_* vars in .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-rtm}:${POSTGRES_PASSWORD:-rtm}@db:5432/${POSTGRES_DB:-rtm_image_parser}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:${PORT:-3000}"

  ui:
    build:
      context: ./ui
      args:
        # Baked into the static bundle at build time — must be reachable from
        # the user's browser, so it targets api's published host port.
        VITE_API_BASE_URL: http://localhost:${PORT:-3000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${UI_PORT:-5173}:80"

volumes:
  db_data:
